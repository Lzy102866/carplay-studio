name: CarPlayWallpaperStudioShell
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: iphoneos
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  CarPlayWallpaperStudioShell:
    type: application
    platform: iOS
    sources:
      - path: CarPlayWallpaperStudioShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CarPlayWallpaperStudio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 壁纸工坊
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: 用于与本机建立连接，完成配对与壁纸刷新。
        NSBonjourServices:
          - _stikpairprobe._tcp
        ITSAppUsesNonExemptEncryption: false
